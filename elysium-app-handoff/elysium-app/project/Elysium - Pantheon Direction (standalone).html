radius: var(--r-lg);\n  background: linear-gradient(180deg, rgba(201,165,107,0.12), rgba(201,165,107,0.02));\n}\n.care-hero .ch-eyebrow { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--bronze); margin-bottom: 10px; }\n.care-hero .ch-night { display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px; }\n.care-hero .ch-rom { font-family: var(--font-display); font-style: italic; font-size: 19px; color: var(--bronze); }\n.care-hero .ch-proto { font-size: 17px; color: var(--ink); letter-spacing: -0.01em; }\n.care-hero .ch-note { font-family: var(--font-display); font-style: italic; font-size: 13px; color: var(--ink-muted); line-height: 1.45; }\n.crow { display: flex; align-items: center; gap: 13px; padding: 12px 2px; border-bottom: 1px solid var(--separator); }\n.crow:first-of-type { border-top: 1px solid var(--separator); }\n.crow .check { width: 19px; height: 19px; }\n.ctext { flex: 1; font-size: 14px; color: var(--ink); }\n.crow.done .ctext { color: var(--ink-faint); text-decoration: line-through; text-decoration-color: rgba(201,165,107,0.3); }\n.cinfo { font-family: var(--font-mono); font-size: 8px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-ghost); }\n.chip-row { display: flex; gap: 8px; margin-top: 12px; }\n.chip { font-family: var(--font-sans); font-size: 12px; color: var(--ink-muted); border: 1px solid var(--separator-strong); border-radius: 999px; padding: 6px 13px; }\n.chip.on { color: var(--bg); background: var(--bronze); border-color: var(--bronze); }\n.memory {\n  margin-top: 16px; padding: 13px 15px;\n  border-left: 2px solid var(--bronze-dim); background: var(--bg-soft);\n  border-radius: 0 var(--r-md) var(--r-md) 0;\n}\n.memory .mlab { font-family: var(--font-mono); font-size: 8px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--bronze); margin-bottom: 4px; }\n.memory .mfrom { font-family: var(--font-mono); font-size: 8px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-faint); margin-bottom: 7px; }\n.memory .mline { font-family: var(--font-display); font-style: italic; font-size: 13px; color: var(--ink-muted); line-height: 1.45; }\n.apollo-strip {\n  margin-top: 14px; display: flex; align-items: center; gap: 11px;\n  padding: 11px 14px; border: 1px solid var(--separator); border-radius: var(--r-md);\n  background: var(--bg-soft);\n}\n.apollo-strip .glyph { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--separator-strong); display:flex; align-items:center; justify-content:center; color: var(--bronze); flex-shrink: 0; }\n.apollo-strip .glyph svg { width: 16px; height: 16px; }\n.apollo-strip .as-body { flex: 1; }\n.apollo-strip .as-name { font-size: 13px; color: var(--ink); }\n.apollo-strip .as-name em { font-family: var(--font-display); font-size: 11.5px; color: var(--ink-faint); margin-left: 6px; }\n.apollo-strip .as-sub { font-size: 11.5px; color: var(--ink-muted); }\n.apollo-strip .as-state { font-family: var(--font-mono); font-size: 8px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--bronze); }\n\n/* ---- analysis column (shared with mock) ---- */\n.mock-notes .dir-name { display: flex; align-items: baseline; gap: 14px; margin-bottom: 8px; }\n.mock-notes .dir-name h3 { font-size: 30px; letter-spacing: -0.025em; }\n.mock-notes .tagline { font-family: var(--font-display); font-style: italic; color: var(--ink-muted); font-size: 17px; margin-bottom: 28px; }\n.spec { display: flex; flex-direction: column; }\n.spec > div { display: grid; grid-template-columns: 128px 1fr; gap: 22px; padding: 16px 0; border-top: 1px solid var(--separator); }\n.spec > div:last-child { border-bottom: 1px solid var(--separator); }\n.spec dt { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--bronze); padding-top: 3px; }\n.spec dd { color: var(--ink-muted); font-size: 14.5px; line-height: 1.62; }\n.spec dd strong { color: var(--ink); }\n.judgement { display: grid; grid-template-columns: 1fr 1fr; margin-top: 30px; border-top: 1px solid var(--separator); }\n@media (max-width: 520px) { .judgement { grid-template-columns: 1fr; } }\n.judgement > div { padding: 20px 24px 20px 0; }\n.judgement > div + div { border-left: 1px solid var(--separator); padding-left: 28px; }\n@media (max-width: 520px) { .judgement > div + div { border-left: 0; padding-left: 0; border-top: 1px solid var(--separator); } }\n.judgement h4 { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: 0.18em; text-transform: uppercase; margin-bottom: 12px; font-weight: 400; }\n.judgement.keep h4 { color: var(--bronze); }\n.judgement .remove h4 { color: var(--rust); }\n.judgement ul { list-style: none; display: flex; flex-direction: column; gap: 9px; }\n.judgement li { font-size: 13.5px; color: var(--ink-muted); line-height: 1.45; padding-left: 16px; position: relative; }\n.judgement li::before { content: \"—\"; position: absolute; left: 0; color: var(--ink-faint); }\n\n/* ============================================================\n   Verdict table (Light/Body/Mind/Water/Sleep)\n   ============================================================ */\n.verdicts { margin-top: 44px; display: flex; flex-direction: column; }\n.verdict-row {\n  display: grid; grid-template-columns: 56px 150px 130px 1fr; gap: 24px;\n  padding: 24px 0; border-top: 1px solid var(--separator); align-items: start;\n}\n.verdict-row:last-child { border-bottom: 1px solid var(--separator); }\n@media (max-width: 820px) { .verdict-row { grid-template-columns: 1fr; gap: 10px; } }\n.verdict-row .vglyph { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--separator-strong); background: var(--bg-soft); display: flex; align-items: center; justify-content: center; color: var(--bronze); }\n.verdict-row .vglyph svg { width: 22px; height: 22px; }\n.verdict-row.gone .vglyph { color: var(--ink-ghost); border-style: dashed; }\n.vname .domain { font-size: 18px; color: var(--ink); letter-spacing: -0.01em; }\n.vname .becomes { font-family: var(--font-display); font-style: italic; font-size: 14px; color: var(--bronze); margin-top: 2px; }\n.vname .becomes.gone { color: var(--rust); }\n.vaction {\n  font-family: var(--font-mono); font-size: 9.5px; letter-spacing: 0.14em;\n  text-transform: uppercase; color: var(--bronze);\n  border: 1px solid var(--separator-strong); border-radius: 999px;\n  padding: 5px 11px; display: inline-block; height: fit-content; white-space: nowrap;\n}\n.vaction.retire { color: var(--rust); border-color: rgba(201,138,107,0.4); }\n.vaction.rebuild { color: var(--bronze); }\n.vwhy { color: var(--ink-muted); font-size: 14.5px; line-height: 1.62; }\n.vwhy strong { color: var(--ink); }\n\n/* ============================================================\n   Roadmap tickets\n   ============================================================ */\n.roadmap { margin-top: 40px; display: flex; flex-direction: column; gap: 20px; }\n.ticket {\n  border: 1px solid var(--separator); border-radius: var(--r-lg);\n  background: var(--bg-soft); overflow: hidden;\n}\n.ticket-head { display: flex; align-items: center; gap: 16px; padding: 20px 26px; border-bottom: 1px solid var(--separator); }\n.ticket-head .ea { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.14em; color: var(--bg); background: var(--bronze); padding: 5px 10px; border-radius: 6px; }\n.ticket-head .tt { font-size: 18px; color: var(--ink); letter-spacing: -0.015em; }\n.ticket-head .ord { margin-left: auto; font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink-faint); }\n.ticket-grid { display: grid; grid-template-columns: repeat(2, 1fr); }\n@media (max-width: 680px) { .ticket-grid { grid-template-columns: 1fr; } }\n.ticket-grid > div { padding: 18px 26px; border-top: 1px solid var(--separator); }\n.ticket-grid > div:nth-child(even) { border-left: 1px solid var(--separator); }\n@media (max-width: 680px) { .ticket-grid > div:nth-child(even) { border-left: 0; } }\n.ticket-grid dt { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--bronze); margin-bottom: 8px; }\n.ticket-grid dt.warn { color: var(--rust); }\n.ticket-grid dd { font-size: 13.5px; color: var(--ink-muted); line-height: 1.58; }\n.ticket-grid dd code { font-size: 11.5px; color: var(--ink); background: var(--surface); }\n.ticket-grid dd.full { }\n.ticket-grid .span2 { grid-column: 1 / -1; }\n@media (max-width: 680px) { .ticket-grid .span2 { grid-column: auto; } }\n\n/* ============================================================\n   Final warning\n   ============================================================ */\n.warning { margin-top: 44px; display: grid; grid-template-columns: 1fr 1fr; gap: 0; border: 1px solid var(--separator-strong); border-radius: var(--r-lg); overflow: hidden; }\n@media (max-width: 760px) { .warning { grid-template-columns: 1fr; } }\n.warning .wcol { padding: 34px 36px; }\n.warning .wcol + .wcol { border-left: 1px solid var(--separator); }\n@media (max-width: 760px) { .warning .wcol + .wcol { border-left: 0; border-top: 1px solid var(--separator); } }\n.warning .wlab { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--rust); margin-bottom: 16px; }\n.warning h3 { font-size: 22px; margin-bottom: 16px; line-height: 1.2; }\n.warning ul { list-style: none; display: flex; flex-direction: column; gap: 13px; }\n.warning li { font-size: 14px; color: var(--ink-muted); line-height: 1.55; padding-left: 20px; position: relative; }\n.warning li::before { content: \"×\"; position: absolute; left: 2px; color: var(--rust); font-size: 13px; top: 2px; }\n\n.closing { margin-top: 90px; padding-top: 44px; border-top: 1px solid var(--separator); }\n.closing .eyebrow { display:block; margin-bottom: 22px; }\n.closing p { font-family: var(--font-display); font-style: italic; font-size: clamp(22px, 3vw, 30px); color: var(--ink); max-width: 24ch; line-height: 1.35; }\n.closing p .dim { color: var(--ink-muted); }\n.closing .sign { margin-top: 30px; font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink-faint); }\n<\u002Fstyle>\n\n<\u002Fhead>\n<body>\n<div class=\"wrap\">\n\n  <!-- ============ COVER ============ -->\n  <header class=\"cover\" data-screen-label=\"Cover\">\n    <div class=\"eyebrow\">Direction correction · Pantheon-led usefulness · No code<\u002Fdiv>\n    <h1>Mythology as the<br>form of <span class=\"ital\">utility<\u002Fspan><\u002Fh1>\n    <p class=\"lede\">Elysium drifted twice: first into decorative ritual, then into generic usefulness that demoted the gods. This corrects both — by making the Pantheon the structure of daily life, not a coat of paint on it.<\u002Fp>\n    <div class=\"doctrine-stamp\">\n      <span class=\"eyebrow\">The doctrine<\u002Fspan>\n      <p>Mythology should be the form of genuine utility — never a substitute for it. A patron earns its place by owning a job the user would miss.<\u002Fp>\n    <\u002Fdiv>\n    <dl class=\"cover-meta\">\n      <div><dt>Scope<\u002Fdt><dd>Product direction · IA · patron system · Today + Care redesign<\u002Fdd><\u002Fdiv>\n      <div><dt>Governs<\u002Fdt><dd>CLAUDE.md doctrine · Continuity Constitution · Six Tests<\u002Fdd><\u002Fdiv>\n      <div><dt>Deliverable<\u002Fdt><dd>Corrected doctrine · 8 patron specs · 8-ticket roadmap<\u002Fdd><\u002Fdiv>\n      <div><dt>Status after<\u002Fdt><dd>EA-183 · post Water-fold stabilization<\u002Fdd><\u002Fdiv>\n    <\u002Fdl>\n  <\u002Fheader>\n\n  <!-- ============ I · DIAGNOSIS ============ -->\n  <section class=\"block\" id=\"diagnosis\" data-screen-label=\"Diagnosis\">\n    <div class=\"rule\"><span class=\"idx\">I<\u002Fspan><span class=\"lbl\">Diagnosis · how the product drifted<\u002Fspan><\u002Fdiv>\n    <div class=\"sec-head\">\n      <h2>Two wrong turns, in <span class=\"ital\">sequence<\u002Fspan><\u002Fh2>\n      <p class=\"lede-p\">The app is not broken. It is mis-aimed. Each correction so far solved the last problem by creating the next one. The pattern, laid out plainly:<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"drift\">\n      <div class=\"drift-row\">\n        <div class=\"stage\">Origin<small>The seed<\u002Fsmall><\u002Fdiv>\n        <div class=\"desc\">A vanilla-JS <strong>skincare tracker<\u002Fstrong>. Genuinely useful, narrow, and honest. The 3-night ingredient cycle still anchors everything — it is the one surface a user would notice missing within a day.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"drift-row\">\n        <div class=\"stage\">Soul added<small>Right instinct<\u002Fsmall><\u002Fdiv>\n        <div class=\"desc\">Greek myth arrived as the <strong>soul<\u002Fstrong> of the app — Temple, ritual, patron, chronicle. This was correct. It gave a hygiene app a reason to be quiet, premium, and lived-in instead of another optimization scorecard.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"drift-row bad\">\n        <div class=\"stage\">Drift one<small>Decoration<\u002Fsmall><\u002Fdiv>\n        <div class=\"desc\">Then came <strong>ritual surfaces that were beautiful but did nothing<\u002Fstrong> — tap-to-witness, tap-to-hold, tap-to-release. Lovely copy, no payoff. The myth became ornament. A god you tap and nothing changes is set dressing, not structure.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"drift-row bad\">\n        <div class=\"stage\">Drift two<small>Erosion<\u002Fsmall><\u002Fdiv>\n        <div class=\"desc\">The fix for decoration was utility — Today intentions, Care notes, reaction memory, flows. Useful. But usefulness arrived by <strong>thinning the mythology<\u002Fstrong>: Water demoted, Light reduced to a tone-picker, domains becoming labels on ordinary features. The soul started leaving to make room for the tool.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"prose\" style=\"margin-top:46px;\">\n      <p class=\"big\">The mistake in both turns is the same: treating mythology and utility as a trade-off — a slider where moving toward one means away from the other.<\u002Fp>\n      <p>They are not opposites. The error is structural, not tonal. Decorative myth fails because it has no job. Generic utility fails because its job has no form. The correction is to make every patron <strong>own a job<\u002Fstrong>, and let the patron <strong>shape how that job is done<\u002Fstrong>. When that holds, adding utility deepens the myth instead of eroding it.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ II · CORRECTED DOCTRINE ============ -->\n  <section class=\"block\" id=\"doctrine\" data-screen-label=\"Doctrine\">\n    <div class=\"rule\"><span class=\"idx\">II<\u002Fspan><span class=\"lbl\">Corrected doctrine · the patron test<\u002Fspan><\u002Fdiv>\n    <div class=\"sec-head\">\n      <h2>A patron is the <span class=\"ital\">reason<\u002Fspan> a feature has its shape<\u002Fh2>\n      <p class=\"lede-p\">Not a theme applied afterward. Not a name on a button. A patron is the human need a surface exists to serve, and the discipline that decides how it serves it. To survive, every surface passes two gates.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"law\">\n      <div class=\"gate\">\n        <div class=\"gate-no\">Gate one<\u002Fdiv>\n        <h3>The Utility Gate<\u002Fh3>\n        <p>Does this surface do a job the user would genuinely miss if it vanished tomorrow? Strip the Greek name entirely. Is what remains still the best tool for that job?<\u002Fp>\n        <p class=\"fail\"><b>Fails as decoration.<\u002Fb> If removing the name leaves a gesture with no practical residue — a tap that records nothing the user needs, a ritual whose only output is more copy — the surface is ornament. Cut it.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"gate\">\n        <div class=\"gate-no\">Gate two<\u002Fdiv>\n        <h3>The Form Gate<\u002Fh3>\n        <p>Does the patron shape <em>how<\u002Fem> the job is done — its hierarchy, naming, timing, restraint, the moment of the day it belongs to? Could only this patron hold this surface?<\u002Fp>\n        <p class=\"fail\"><b>Fails as generic utility.<\u002Fb> If the surface would be identical in any to-do or wellness app — same layout, same voice, same logic — the myth is a sticker. Re-shape it until the patron is load-bearing.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"law-foot\">\n        <p>Decoration passes Form but fails Utility. Generic software passes Utility but fails Form. Elysium requires both — that is the entire correction.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"prose\" style=\"margin-top:46px;\">\n      <p>This sits <em>above<\u002Fem> the Continuity Constitution, not against it. The constitution governs what continuity may never become (a counter, a streak, a dashboard). The Patron Test governs whether a surface deserves to exist at all. A surface must pass both: the Patron Test for purpose, the Six Tests for how it remembers.<\u002Fp>\n      <p>Practically, the test reorganizes the whole product around a simple claim: <strong>each patron owns one real human need and one moment of the day.<\u002Fstrong> The myth is not the wallpaper of the room — it is the floor plan.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ III · REVISED IA ============ -->\n  <section class=\"block\" id=\"ia\" data-screen-label=\"Information architecture\">\n    <div class=\"rule\"><span class=\"idx\">III<\u002Fspan><span class=\"lbl\">Revised architecture · the spine &amp; the arc<\u002Fspan><\u002Fdiv>\n    <div class=\"sec-head\">\n      <h2>Four tabs. One <span class=\"ital\">day-arc<\u002Fspan>. Eight patrons.<\u002Fh2>\n      <p class=\"lede-p\">Keep the four-tab spine — it is correct and shipped. Do not add patron tabs; the nav is not the Pantheon. The patrons live in <em>time<\u002Fem> (the day-arc) and in <em>place<\u002Fem> (Temple). The tabs answer four different questions.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"spine\">\n      <div class=\"spine-tabs\">\n        <div class=\"spine-tab primary\">\n          <span class=\"pos\">Tab 01 · first<\u002Fspan>\n          <span class=\"name\">Today<\u002Fspan>\n          <span class=\"patron\">Kairos — the present moment<\u002Fspan>\n          <span class=\"role\">\"What does <em>now<\u002Fem> ask of me?\" The front door. Stays first.<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"spine-tab primary\">\n          <span class=\"pos\">Tab 02 · anchor<\u002Fspan>\n          <span class=\"name\">Care<\u002Fspan>\n          <span class=\"patron\">Hygieia — the body kept<\u002Fspan>\n          <span class=\"role\">\"What does my skin need tonight?\" The practical anchor. Stays.<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"spine-tab\">\n          <span class=\"pos\">Tab 03 · the room<\u002Fspan>\n          <span class=\"name\">Temple<\u002Fspan>\n          <span class=\"patron\">the Pantheon entire<\u002Fspan>\n          <span class=\"role\">\"Where do all the patrons stand today?\" The whole room, arranged by the arc.<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"spine-tab\">\n          <span class=\"pos\">Tab 04 · the house<\u002Fspan>\n          <span class=\"name\">Workshop<\u002Fspan>\n          <span class=\"patron\">mortal back-of-house<\u002Fspan>\n          <span class=\"role\">Account, cues, data, install. Deliberately un-patroned — the one honest seam.<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"arc\">\n      <div class=\"arc-title\">The day-arc — patrons mapped to time<\u002Fdiv>\n      <p class=\"arc-sub\">This is the real structure. Today and Temple both read from it. Each patron surfaces when its hour comes, and recedes when it passes. No patron is ever \"behind.\"<\u002Fp>\n      <div class=\"arc-track\">\n        <div class=\"arc-step\">\n          <span class=\"when\">First light<\u002Fspan>\n          <span class=\"dot\"><\u002Fspan>\n          <span class=\"who\">Apollo<\u002Fspan>\n          <span class=\"surf\">Light → Care<\u002Fspan>\n          <span class=\"job\">Name the day; protect it. SPF threshold before you step out.<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"arc-step\">\n          <span class=\"when\">Morning<\u002Fspan>\n          <span class=\"dot\"><\u002Fspan>\n          <span class=\"who\">Kairos<\u002Fspan>\n          <span class=\"surf\">Today<\u002Fspan>\n          <span class=\"job\">Place 1–3 intentions. Receive what yesterday left.<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"arc-step\">\n          <span class=\"when\">Midday<\u002Fspan>\n          <span class=\"dot\"><\u002Fspan>\n          <span class=\"who\">Athena<\u002Fspan>\n          <span class=\"surf\">Mind<\u002Fspan>\n          <span class=\"job\">Offload one thread. Turn a worry into an intention, or set it down.<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"arc-step\">\n          <span class=\"when\">Evening<\u002Fspan>\n          <span class=\"dot\"><\u002Fspan>\n          <span class=\"who\">Hygieia · Asclepius<\u002Fspan>\n          <span class=\"surf\">Care · Recovery<\u002Fspan>\n          <span class=\"job\">Night protocol. If skin reacted, Asclepius pulls the actives back.<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"arc-step\">\n          <span class=\"when\">Night<\u002Fspan>\n          <span class=\"dot\"><\u002Fspan>\n          <span class=\"who\">Mnemosyne · Hypnos<\u002Fspan>\n          <span class=\"surf\">Chronicle · Sleep<\u002Fspan>\n          <span class=\"job\">Write what remains. Decide what carries into tomorrow. Close the day.<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"prose\" style=\"margin-top:44px;\">\n      <p><strong>On the four pillars question.<\u002Fstrong> The brief floats Care / Today / Chronicle / Sleep as the main pillars. Three of those are right; Sleep is not a pillar — it is an <em>endpoint<\u002Fem>, used once a night, and does not earn a permanent tab. Chronicle (Mnemosyne) <em>is<\u002Fem> precious enough to deserve prominence, but it earns it inside Temple as the night's anchor patron, not as a fourth tab that sits empty for most of the day. The spine stays: Now, Anchor, Room, House.<\u002Fp>\n      <p><strong>On \"should domains become patrons.\"<\u002Fstrong> Yes — every domain becomes a patron with a job, but the patron name is never the tappable label. You enter \"Care,\" subtitled <em>Hygieia<\u002Fem>; you enter \"Mind,\" subtitled <em>Athena<\u002Fem>. The god is the form and the why; the plain word is the door.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ IV · THE PANTHEON ============ -->\n  <section class=\"block\" id=\"pantheon\" data-screen-label=\"The Pantheon\">\n    <div class=\"rule\"><span class=\"idx\">IV<\u002Fspan><span class=\"lbl\">The Pantheon · patron-by-patron design system<\u002Fspan><\u002Fdiv>\n    <div class=\"sec-head\">\n      <h2>Eight patrons, each with a <span class=\"ital\">job<\u002Fspan><\u002Fh2>\n      <p class=\"lede-p\">For each: the practical job it owns, its visual role, the interactions it is allowed, what must be removed or avoided, and how it appears in the UI. Two patrons are corrections to existing domains; one is a retirement.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"pantheon\">\n\n      <!-- HYGIEIA -->\n      <article class=\"patron\">\n        <div class=\"patron-id\">\n          <div class=\"medallion\"><svg viewBox=\"0 0 32 32\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.25\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"16\" cy=\"16\" r=\"10\"><\u002Fcircle><path d=\"M10 16 A6 6 0 0 1 22 16\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n          <span class=\"verdict keep\">Anchor · keep<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"patron-body\">\n          <div class=\"pat-head\"><h3>Hygieia<\u002Fh3><span class=\"pat-domain\">Care<\u002Fspan><\u002Fdiv>\n          <p class=\"pat-tag\">The practical anchor. The reason the app survives a day of disuse everywhere else.<\u002Fp>\n          <dl class=\"pat-grid\">\n            <div><dt>Practical job<\u002Fdt><dd>The skincare protocol: morning/night routine, the 3-night active-ingredient cycle (niacinamide · salicylic · rest), skin check-in, reaction notes, irritation memory.<\u002Fdd><\u002Fdiv>\n            <div><dt>Visual role<\u002Fdt><dd>The only <strong>featured<\u002Fstrong> surface — bronze-gradient hero card, the warmest material in the app. Care is allowed elevation no other patron gets, because it carries real consequence (active acids on skin).<\u002Fdd><\u002Fdiv>\n            <div><dt>Allowed<\u002Fdt><dd>Step completion, cycle position display, skin condition chips, reaction note, the §19A practical calendar, \"last time on this night\" reaction memory.<\u002Fdd><\u002Fdiv>\n            <div><dt class=\"cut\">Avoid<\u002Fdt><dd class=\"cut\">Streaks, adherence %, \"you kept 4 of 7.\" Care has a practical history exception — it is <strong>not<\u002Fstrong> a license for scorecards.<\u002Fdd><\u002Fdiv>\n            <div><dt>Appears as<\u002Fdt><dd>The Care tab hero + tonight's protocol; the day-arc evening anchor; the featured card on Temple.<\u002Fdd><\u002Fdiv>\n          <\u002Fdl>\n        <\u002Fdiv>\n      <\u002Farticle>\n\n      <!-- KAIROS -->\n      <article class=\"patron\">\n        <div class=\"patron-id\">\n          <div class=\"medallion\"><svg viewBox=\"0 0 32 32\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.25\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"16\" cy=\"16\" r=\"10\"><\u002Fcircle><path d=\"M16 10v6l4.5 2.6\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n          <span class=\"verdict keep\">Front door · keep<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"patron-body\">\n          <div class=\"pat-head\"><h3>Kairos<\u002Fh3><span class=\"pat-domain\">Today<\u002Fspan><\u002Fdiv>\n          <p class=\"pat-tag\">Not chronological time — the <em>opportune<\u002Fem> moment. The present, asking to be met.<\u002Fp>\n          <dl class=\"pat-grid\">\n            <div><dt>Practical job<\u002Fdt><dd>What matters today: 1–3 intentions in the user's own words, yesterday's carryover, the open loops the present hour holds.<\u002Fdd><\u002Fdiv>\n            <div><dt>Visual role<\u002Fdt><dd>A <strong>threshold<\u002Fstrong>, not a list. Masthead + naked separator rows on the obsidian floor. The front door identity: mono date, DM Sans heading, Spectral accent noun.<\u002Fdd><\u002Fdiv>\n            <div><dt>Allowed<\u002Fdt><dd>Add / keep / release intention; one-day quiet carryover echo; time-aware open rows that point to the hour's patrons (§19B).<\u002Fdd><\u002Fdiv>\n            <div><dt class=\"cut\">Avoid<\u002Fdt><dd class=\"cut\">Reading like a generic todo app. No \"tasks,\" no priority, no due dates, no counts, no progress bar. Kairos holds the present — it does not schedule the future.<\u002Fdd><\u002Fdiv>\n            <div><dt>Appears as<\u002Fdt><dd>Tab 01, first surface on open. Detailed redesign in §V.<\u002Fdd><\u002Fdiv>\n          <\u002Fdl>\n        <\u002Fdiv>\n      <\u002Farticle>\n\n      <!-- MNEMOSYNE -->\n      <article class=\"patron\">\n        <div class=\"patron-id\">\n          <div class=\"medallion\"><svg viewBox=\"0 0 32 32\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.25\"><circle cx=\"16\" cy=\"16\" r=\"10\"><\u002Fcircle><circle cx=\"16\" cy=\"16\" r=\"5.5\"><\u002Fcircle><circle cx=\"16\" cy=\"16\" r=\"1.5\" fill=\"currentColor\"><\u002Fcircle><\u002Fsvg><\u002Fdiv>\n          <span class=\"verdict keep\">Memory · keep<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"patron-body\">\n          <div class=\"pat-head\"><h3>Mnemosyne<\u002Fh3><span class=\"pat-domain\">Chronicle<\u002Fspan><\u002Fdiv>\n          <p class=\"pat-tag\">The deep well. Memory itself — not a journal feature, the domain of remembering.<\u002Fp>\n          <dl class=\"pat-grid\">\n            <div><dt>Practical job<\u002Fdt><dd>Writing, archive, plain substring search, and resurfacing — the room returning a line you forgot writing. The most precious data in the app.<\u002Fdd><\u002Fdiv>\n            <div><dt>Visual role<\u002Fdt><dd>Spectral-italic writing surface; dashed bronze prompt card; faint resurfaced lines that age qualitatively. Quiet, ink-and-paper, never database chrome.<\u002Fdd><\u002Fdiv>\n            <div><dt>Allowed<\u002Fdt><dd>Write; read reverse-chronologically; literal search; the Well surfaces one entry by date/cycle math (§15.4A, §11).<\u002Fdd><\u002Fdiv>\n            <div><dt class=\"cut\">Avoid<\u002Fdt><dd class=\"cut\">Tags, folders, word counts, sentiment, \"N entries about X,\" relevance ranking. Mnemosyne remembers — she does not <em>analyze<\u002Fem>.<\u002Fdd><\u002Fdiv>\n            <div><dt>Appears as<\u002Fdt><dd>Temple's night-anchor patron; reachable from Today's open rows at evening/night. The most prominent secondary patron.<\u002Fdd><\u002Fdiv>\n          <\u002Fdl>\n        <\u002Fdiv>\n      <\u002Farticle>\n\n      <!-- HYPNOS -->\n      <article class=\"patron\">\n        <div class=\"patron-id\">\n          <div class=\"medallion\"><svg viewBox=\"0 0 32 32\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.25\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M22 18.5 A8.5 8.5 0 1 1 14 7 A6.6 6.6 0 0 0 22 18.5 Z\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n          <span class=\"verdict keep\">Closure · keep<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"patron-body\">\n          <div class=\"pat-head\"><h3>Hypnos<\u002Fh3><span class=\"pat-domain\">Sleep<\u002Fspan><\u002Fdiv>\n          <p class=\"pat-tag\">Closure. The patron who lets the app — and the day — go quiet.<\u002Fp>\n          <dl class=\"pat-grid\">\n            <div><dt>Practical job<\u002Fdt><dd>Shutdown: the parking note, deciding what carries into tomorrow, the night-to-morning handoff. The one surface that ends the day.<\u002Fdd><\u002Fdiv>\n            <div><dt>Visual role<\u002Fdt><dd>A darkening, narrowing ritual. Closure invitations, one optional parking line, the carry / let-pass decision on unkept intentions.<\u002Fdd><\u002Fdiv>\n            <div><dt>Allowed<\u002Fdt><dd>Closure mark; parking note (persists); carry/pass routing of Today's unkept items into tomorrow's carryover (§19C).<\u002Fdd><\u002Fdiv>\n            <div><dt class=\"cut\">Avoid<\u002Fdt><dd class=\"cut\">Becoming a sleep tracker. No bedtime stats, no duration, no consistency graph, no \"you slept X.\" The app does not know — and must never ask.<\u002Fdd><\u002Fdiv>\n            <div><dt>Appears as<\u002Fdt><dd>Day-arc endpoint (night); reachable from Today's open rows after dusk; closes into the next morning's Kairos handoff.<\u002Fdd><\u002Fdiv>\n          <\u002Fdl>\n        <\u002Fdiv>\n      <\u002Farticle>\n\n      <!-- ATHENA -->\n      <article class=\"patron\">\n        <div class=\"patron-id\">\n          <div class=\"medallion\"><svg viewBox=\"0 0 32 32\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.25\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M16 6 26 16 16 26 6 16 Z\"><\u002Fpath><line x1=\"8.5\" y1=\"16\" x2=\"23.5\" y2=\"16\"><\u002Fline><\u002Fsvg><\u002Fdiv>\n          <span class=\"verdict keep\">Clarity · keep<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"patron-body\">\n          <div class=\"pat-head\"><h3>Athena<\u002Fh3><span class=\"pat-domain\">Mind<\u002Fspan><\u002Fdiv>\n          <p class=\"pat-tag\">Clarity. Not stillness for its own sake — the work of choosing one thread.<\u002Fp>\n          <dl class=\"pat-grid\">\n            <div><dt>Practical job<\u002Fdt><dd>Mental-load offload: place a worrying thread in the room to relieve occupation, then either <strong>send it to Today<\u002Fstrong> as an intention or set it down. Turning thought into a decision.<\u002Fdd><\u002Fdiv>\n            <div><dt>Visual role<\u002Fdt><dd>A single calm offload surface — one textarea, three plain actions. Spartan, like a clear desk. Already correct as of EA-178B; protect it.<\u002Fdd><\u002Fdiv>\n            <div><dt>Allowed<\u002Fdt><dd>Hold one thread for the day; \"Set it down\" / \"Send to Today\" / \"Clear.\" Expires at day-end (§18.8).<\u002Fdd><\u002Fdiv>\n            <div><dt class=\"cut\">Avoid<\u002Fdt><dd class=\"cut\">A productivity <strong>timer<\u002Fstrong>. No countdown, no session length, no \"minutes held,\" no breath-streak. The 60s floor was structure, not a goal — do not resurrect duration UI.<\u002Fdd><\u002Fdiv>\n            <div><dt>Appears as<\u002Fdt><dd>Day-arc midday; the bridge between Mind and Today — the only patron that writes directly into Kairos.<\u002Fdd><\u002Fdiv>\n          <\u002Fdl>\n        <\u002Fdiv>\n      <\u002Farticle>\n\n      <!-- APOLLO -->\n      <article class=\"patron\">\n        <div class=\"patron-id\">\n          <div class=\"medallion\"><svg viewBox=\"0 0 32 32\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.25\"><circle cx=\"16\" cy=\"16\" r=\"4.4\"><\u002Fcircle><circle cx=\"16\" cy=\"5.5\" r=\"1.4\" fill=\"currentColor\"><\u002Fcircle><circle cx=\"16\" cy=\"26.5\" r=\"1.4\" fill=\"currentColor\"><\u002Fcircle><circle cx=\"5.5\" cy=\"16\" r=\"1.4\" fill=\"currentColor\"><\u002Fcircle><circle cx=\"26.5\" cy=\"16\" r=\"1.4\" fill=\"currentColor\"><\u002Fcircle><circle cx=\"8.5\" cy=\"8.5\" r=\"1.4\" fill=\"currentColor\"><\u002Fcircle><circle cx=\"23.5\" cy=\"8.5\" r=\"1.4\" fill=\"currentColor\"><\u002Fcircle><circle cx=\"8.5\" cy=\"23.5\" r=\"1.4\" fill=\"currentColor\"><\u002Fcircle><circle cx=\"23.5\" cy=\"23.5\" r=\"1.4\" fill=\"currentColor\"><\u002Fcircle><\u002Fsvg><\u002Fdiv>\n          <span class=\"verdict\">Light · rebuild<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"patron-body\">\n          <div class=\"pat-head\"><h3>Apollo<\u002Fh3><span class=\"pat-domain\">Light<\u002Fspan><\u002Fdiv>\n          <p class=\"pat-tag\">Daylight and the sun. The weak mapping today; the strong one tomorrow.<\u002Fp>\n          <dl class=\"pat-grid\">\n            <div><dt>Practical job<\u002Fdt><dd><strong>Daytime protection.<\u002Fstrong> SPF awareness tied to Care's sunscreen step, sun-exposure threshold, the morning go-out moment. The patron of the sun should be about the sun on your skin — not \"noticing the morning.\"<\u002Fdd><\u002Fdiv>\n            <div><dt>Visual role<\u002Fdt><dd>An airy morning threshold that carries one practical line: is SPF on before you cross it. The tone-of-morning gesture stays, but rides <em>on top of<\u002Fem> a real check.<\u002Fdd><\u002Fdiv>\n            <div><dt>Allowed<\u002Fdt><dd>Morning entry; an SPF-on acknowledgment that links to Care m2; a sun-threshold cue. Witness marks persist as horizon fade (§16).<\u002Fdd><\u002Fdiv>\n            <div><dt class=\"cut\">Avoid · today's weakness<\u002Fdt><dd class=\"cut\">Apollo is currently a <strong>tone-picker<\u002Fstrong> (Soft / Clear / Steady / Guarded) with no payoff — pure Drift-one decoration. It fails the Utility Gate. Rebuild it around SPF or fold it into Care's morning.<\u002Fdd><\u002Fdiv>\n            <div><dt>Appears as<\u002Fdt><dd>Day-arc first-light, feeding directly into Hygieia's morning protocol.<\u002Fdd><\u002Fdiv>\n          <\u002Fdl>\n        <\u002Fdiv>\n      <\u002Farticle>\n\n      <!-- ASCLEPIUS -->\n      <article class=\"patron\">\n        <div class=\"patron-id\">\n          <div class=\"medallion\"><svg viewBox=\"0 0 32 32\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.25\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M16 7 23 21 9 21 Z\"><\u002Fpath><line x1=\"7\" y1=\"24.5\" x2=\"25\" y2=\"24.5\"><\u002Fline><\u002Fsvg><\u002Fdiv>\n          <span class=\"verdict\">Body · rebuild → rename<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"patron-body\">\n          <div class=\"pat-head\"><h3>Asclepius<\u002Fh3><span class=\"pat-domain\">Body → Recovery<\u002Fspan><\u002Fdiv>\n          <p class=\"pat-tag\">Healing. The patron you go to when the protocol hurt you.<\u002Fp>\n          <dl class=\"pat-grid\">\n            <div><dt>Practical job<\u002Fdt><dd><strong>Skin recovery &amp; barrier repair.<\u002Fstrong> When skin reacts to actives or sun: pull treatment back, simplify, support the barrier. Care is the plan; Asclepius is what to do when the plan irritates. Tightly bound to Hygieia's reaction state.<\u002Fdd><\u002Fdiv>\n            <div><dt>Visual role<\u002Fdt><dd>A calm, clinical relief surface — not a wellness stretch screen. Reads as \"ease off,\" the medical-quiet counterpart to Care's active hero.<\u002Fdd><\u002Fdiv>\n            <div><dt>Allowed<\u002Fdt><dd>Recovery guidance keyed to today's skin condition; \"rest the actives\" routing; a same-session grounding pause inherited from the old Body/Water reset.<\u002Fdd><\u002Fdiv>\n            <div><dt class=\"cut\">Avoid · today's weakness<\u002Fdt><dd class=\"cut\">\"Body\" today is <strong>generic desk-stretch<\u002Fstrong> (neck / shoulders / wrists) — indistinguishable from any wellness app. It fails the Form Gate. Recovery gives it a job only Elysium's skincare core could justify.<\u002Fdd><\u002Fdiv>\n            <div><dt>Appears as<\u002Fdt><dd>Surfaces in Care's night section when condition = irritated; a quiet Temple patron otherwise. Desk-relief survives as a minor affordance, not the soul.<\u002Fdd><\u002Fdiv>\n          <\u002Fdl>\n        <\u002Fdiv>\n      <\u002Farticle>\n\n      <!-- LETHE / WATER -->\n      <article class=\"patron\">\n        <div class=\"patron-id\">\n          <div class=\"medallion retired\"><svg viewBox=\"0 0 32 32\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.25\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M7 14 q4 -4 8 0 q4 4 8 0\"><\u002Fpath><path d=\"M7 20 q4 -4 8 0 q4 4 8 0\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n          <span class=\"verdict retire\">Water · retire<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"patron-body\">\n          <div class=\"pat-head\"><h3>Lethe<\u002Fh3><span class=\"pat-domain\">Water — retire as standalone<\u002Fspan><\u002Fdiv>\n          <p class=\"pat-tag\">The strongest temptation toward decoration. Resolve it by removing it.<\u002Fp>\n          <dl class=\"pat-grid\">\n            <div><dt>The problem<\u002Fdt><dd>Water has no job. A <strong>hydration counter<\u002Fstrong> violates the constitution (counts forbidden). A <strong>Lethe \"release\" mechanic<\u002Fstrong> — tap to forget — is the purest example of the decorative ritual the brief warns against: beautiful, and entirely without payoff. Both proposed rescues fail a gate.<\u002Fdd><\u002Fdiv>\n            <div><dt>The verdict<\u002Fdt><dd><strong>Retire the standalone domain.<\u002Fstrong> EA-179 → EA-183 already demoted and folded most of it; finish the job. Do not revive it as Lethe.<\u002Fdd><\u002Fdiv>\n            <div><dt>Fold the crumbs<\u002Fdt><dd>The one useful fragment — hydration — becomes a line inside <strong>Hygieia<\u002Fstrong> (it already exists: habit \"drink 2.5–3L\"). The \"notice temperature, breathe, continue\" grounding pause folds into <strong>Asclepius<\u002Fstrong> as a recovery micro-action.<\u002Fdd><\u002Fdiv>\n            <div><dt class=\"cut\">Avoid<\u002Fdt><dd class=\"cut\">Keeping a domain alive because it already exists. A patron with no job is the exact failure this correction is fixing.<\u002Fdd><\u002Fdiv>\n            <div><dt>Appears as<\u002Fdt><dd>Nowhere, as itself. Its useful matter lives on inside Hygieia and Asclepius.<\u002Fdd><\u002Fdiv>\n          <\u002Fdl>\n        <\u002Fdiv>\n      <\u002Farticle>\n\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ V · TODAY REDESIGN (KAIROS) ============ -->\n  <section class=\"block\" id=\"today\" data-screen-label=\"Today / Kairos redesign\">\n    <div class=\"rule\"><span class=\"idx\">V<\u002Fspan><span class=\"lbl\">Redesign · Today as Kairos<\u002Fspan><\u002Fdiv>\n    <div class=\"sec-head\">\n      <h2>The <span class=\"ital\">threshold<\u002Fspan>, not the checklist<\u002Fh2>\n      <p class=\"lede-p\">Today is the front door. It must feel like crossing into a quiet, well-kept room — while still being the most useful surface in the app. The reframe is Kairos: the present moment, met, never a backlog to clear.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"mock-pair\">\n      <div class=\"dir-mock\">\n        <div class=\"phone\">\n          <div class=\"scr\">\n            <div class=\"statusbar\"><span>9:41<\u002Fspan><span class=\"dots\">•••<\u002Fspan><\u002Fdiv>\n            <div class=\"scr-body\">\n              <div class=\"m-head\">\n                <div class=\"m-eyebrow\">Thursday · 29 May · Morning<\u002Fdiv>\n                <div class=\"m-title\">What the <span class=\"ital\">morning<\u002Fspan> asks<\u002Fdiv>\n                <div class=\"m-sub\">Two intentions placed. Light is unentered; care is still open.<\u002Fdiv>\n              <\u002Fdiv>\n\n              <div class=\"s-hd\"><span class=\"lab\">Placed<\u002Fspan><span class=\"meta\">02 / 03<\u002Fspan><\u002Fdiv>\n              <div class=\"irow\">\n                <span class=\"check\"><\u002Fspan>\n                <span class=\"itext\">Call the pharmacy<\u002Fspan>\n                <span class=\"rel\"><svg viewBox=\"0 0 16 16\" width=\"13\" height=\"13\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\"><line x1=\"4\" y1=\"4\" x2=\"12\" y2=\"12\"><\u002Fline><line x1=\"12\" y1=\"4\" x2=\"4\" y2=\"12\"><\u002Fline><\u002Fsvg><\u002Fspan>\n              <\u002Fdiv>\n              <div class=\"irow kept\">\n                <span class=\"check done\"><svg viewBox=\"0 0 12 12\" width=\"11\" height=\"11\" fill=\"none\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"2.5 6.5 5 9 9.5 3.5\"><\u002Fpolyline><\u002Fsvg><\u002Fspan>\n                <span class=\"itext\">Walk before noon<\u002Fspan>\n                <span class=\"rel\"><svg viewBox=\"0 0 16 16\" width=\"13\" height=\"13\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\"><line x1=\"4\" y1=\"4\" x2=\"12\" y2=\"12\"><\u002Fline><line x1=\"12\" y1=\"4\" x2=\"4\" y2=\"12\"><\u002Fline><\u002Fsvg><\u002Fspan>\n              <\u002Fdiv>\n              <div class=\"add-line\">Place another<\u002Fdiv>\n\n              <div class=\"echo\">\n                <div class=\"echo-lab\">Yesterday left<\u002Fdiv>\n                <div class=\"echo-text\">\"Email the studio\"<\u002Fdiv>\n                <div class=\"echo-acts\"><span class=\"fwd\">Bring forward<\u002Fspan><span class=\"pass\">Let it pass<\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n\n              <div class=\"s-hd\"><span class=\"lab\">The hour holds<\u002Fspan><span class=\"meta\">Morning<\u002Fspan><\u002Fdiv>\n              <div class=\"orow\">\n                <span class=\"glyph\"><svg viewBox=\"0 0 32 32\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\"><circle cx=\"16\" cy=\"16\" r=\"4.4\"><\u002Fcircle><circle cx=\"16\" cy=\"6\" r=\"1.5\" fill=\"currentColor\"><\u002Fcircle><circle cx=\"16\" cy=\"26\" r=\"1.5\" fill=\"currentColor\"><\u002Fcircle><circle cx=\"6\" cy=\"16\" r=\"1.5\" fill=\"currentColor\"><\u002Fcircle><circle cx=\"26\" cy=\"16\" r=\"1.5\" fill=\"currentColor\"><\u002Fcircle><\u002Fsvg><\u002Fspan>\n                <span class=\"obody\"><span class=\"otext\">Light · protect the day<\u002Fspan><span class=\"opatron\">Apollo<\u002Fspan><\u002Fspan>\n                <span class=\"ostate\">Open<\u002Fspan>\n                <svg class=\"chev\" viewBox=\"0 0 16 16\" width=\"12\" height=\"12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"5 3 11 8 5 13\"><\u002Fpolyline><\u002Fsvg>\n              <\u002Fdiv>\n              <div class=\"orow\">\n                <span class=\"glyph\"><svg viewBox=\"0 0 32 32\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\"><circle cx=\"16\" cy=\"16\" r=\"10\"><\u002Fcircle><path d=\"M10 16 A6 6 0 0 1 22 16\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n                <span class=\"obody\"><span class=\"otext\">Care · morning protocol<\u002Fspan><span class=\"opatron\">Hygieia<\u002Fspan><\u002Fspan>\n                <span class=\"ostate\">Open<\u002Fspan>\n                <svg class=\"chev\" viewBox=\"0 0 16 16\" width=\"12\" height=\"12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"5 3 11 8 5 13\"><\u002Fpolyline><\u002Fsvg>\n              <\u002Fdiv>\n              <p class=\"foot-line\">What remains can be kept or left.<\u002Fp>\n            <\u002Fdiv>\n            <nav class=\"tabbar\">\n              <div class=\"tab on\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M12 7v5l3 2\"><\u002Fpath><\u002Fsvg><span>Today<\u002Fspan><\u002Fdiv>\n              <div class=\"tab\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"><circle cx=\"12\" cy=\"12\" r=\"8\"><\u002Fcircle><path d=\"M8 12a4 4 0 0 1 8 0\"><\u002Fpath><\u002Fsvg><span>Care<\u002Fspan><\u002Fdiv>\n              <div class=\"tab\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"><path d=\"M4 20V9l8-5 8 5v11\"><\u002Fpath><path d=\"M4 20h16\"><\u002Fpath><\u002Fsvg><span>Temple<\u002Fspan><\u002Fdiv>\n              <div class=\"tab\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"><circle cx=\"12\" cy=\"12\" r=\"3\"><\u002Fcircle><path d=\"M12 3v3M12 18v3M3 12h3M18 12h3\"><\u002Fpath><\u002Fsvg><span>Workshop<\u002Fspan><\u002Fdiv>\n            <\u002Fnav>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <p class=\"phone-cap\">Today · Kairos · morning state<\u002Fp>\n      <\u002Fdiv>\n\n      <div class=\"mock-notes\">\n        <div class=\"dir-name\"><h3>What changed, and why<\u002Fh3><\u002Fdiv>\n        <p class=\"tagline\">Builds directly on the shipped Threshold (EA-171A). The correction is the patron framing, not a teardown.<\u002Fp>\n        <dl class=\"spec\">\n          <div><dt>Heading<\u002Fdt><dd>From \"Today's <em>intentions<\u002Fem>\" to <strong>\"What the <em>morning<\u002Fem> asks\"<\u002Fstrong> — the accent noun is the <em>moment<\u002Fem>, not the feature. Kairos speaks of the present; the word shifts with the day-arc period (morning / afternoon / evening / night) using logic that already exists.<\u002Fdd><\u002Fdiv>\n          <div><dt>Intentions<\u002Fdt><dd>Unchanged in behaviour and form. Naked separator rows, bronze check, Spectral \"Placed\" label, bare <code>02 / 03<\u002Fcode> capacity glyph. This is the useful core and it stays exactly as shipped.<\u002Fdd><\u002Fdiv>\n          <div><dt>Open rows → patrons<\u002Fdt><dd>The single biggest change. \"Open\" becomes <strong>\"The hour holds\"<\u002Fstrong>, and each open row now carries its <strong>patron<\u002Fstrong>: a small glyph medallion, the plain job (\"Light · protect the day\"), and the italic patron name (\"Apollo\") beneath. The open set stops reading as leftover todos and starts reading as <em>which gods this hour belongs to<\u002Fem>.<\u002Fdd><\u002Fdiv>\n          <div><dt>The arc, felt<\u002Fdt><dd>The rows are ordered and populated by the day-arc: Apollo + Hygieia at morning, Athena at midday, Mnemosyne + Hypnos at night. The user never sees \"the arc\" named — they just find the right patrons waiting at the right hour.<\u002Fdd><\u002Fdiv>\n          <div><dt>Carryover<\u002Fdt><dd>Same one-day echo. Kairos receives what yesterday left; it never accumulates a backlog.<\u002Fdd><\u002Fdiv>\n        <\u002Fdl>\n        <div class=\"judgement keep\">\n          <div><h4>What stays<\u002Fh4><ul><li>Every §19B behaviour: add, keep, release, carryover<\u002Fli><li>The shipped Threshold masthead + naked rows<\u002Fli><li>Bronze check, footer voice, no counts<\u002Fli><\u002Ful><\u002Fdiv>\n          <div class=\"remove\"><h4>What's corrected<\u002Fh4><ul><li>Open rows gain patron identity (glyph + name)<\u002Fli><li>Heading noun tracks the moment, not the feature<\u002Fli><li>Today stops reading as a generic todo list<\u002Fli><\u002Ful><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ VI · CARE REDESIGN (HYGIEIA) ============ -->\n  <section class=\"block\" id=\"care\" data-screen-label=\"Care / Hygieia redesign\">\n    <div class=\"rule\"><span class=\"idx\">VI<\u002Fspan><span class=\"lbl\">Redesign · Care as Hygieia<\u002Fspan><\u002Fdiv>\n    <div class=\"sec-head\">\n      <h2>Hygieia-led, without losing <span class=\"ital\">clarity<\u002Fspan><\u002Fh2>\n      <p class=\"lede-p\">Care is the anchor — and the place to prove the doctrine. Make the patron explicit and let the other patrons interlock around the protocol, while the practical skincare clarity stays front and centre. The myth becomes the structure that holds the medicine.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"mock-pair\">\n      <div class=\"dir-mock\">\n        <div class=\"phone\">\n          <div class=\"scr\">\n            <div class=\"statusbar\"><span>10:18<\u002Fspan><span class=\"dots\">•••<\u002Fspan><\u002Fdiv>\n            <div class=\"scr-body\">\n              <div class=\"m-head\">\n                <div class=\"m-eyebrow\">Hygieia · Night II<\u002Fdiv>\n                <div class=\"m-title\">Tonight's <span class=\"ital\">care<\u002Fspan><\u002Fdiv>\n                <div class=\"m-sub\">Salicylic night. A light hand — actives on the T-zone only.<\u002Fdiv>\n              <\u002Fdiv>\n\n              <div class=\"care-hero\">\n                <div class=\"ch-eyebrow\">The protocol<\u002Fdiv>\n                <div class=\"ch-night\"><span class=\"ch-rom\">II<\u002Fspan><span class=\"ch-proto\">Salicylic acid<\u002Fspan><\u002Fdiv>\n                <div class=\"ch-note\">Exfoliates inside pores. T-zone or affected areas only — not all over. Skip if skin feels dry.<\u002Fdiv>\n              <\u002Fdiv>\n\n              <div class=\"s-hd\"><span class=\"lab\">Tonight<\u002Fspan><span class=\"meta\">03 steps<\u002Fspan><\u002Fdiv>\n              <div class=\"crow done\"><span class=\"check done\"><svg viewBox=\"0 0 12 12\" width=\"10\" height=\"10\" fill=\"none\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"2.5 6.5 5 9 9.5 3.5\"><\u002Fpolyline><\u002Fsvg><\u002Fspan><span class=\"ctext\">Face wash<\u002Fspan><\u002Fdiv>\n              <div class=\"crow\"><span class=\"check\"><\u002Fspan><span class=\"ctext\">Salicylic acid serum<\u002Fspan><span class=\"cinfo\">pea-sized<\u002Fspan><\u002Fdiv>\n              <div class=\"crow\"><span class=\"check\"><\u002Fspan><span class=\"ctext\">Light moisturizer<\u002Fspan><\u002Fdiv>\n\n              <div class=\"s-hd\"><span class=\"lab\">Skin tonight<\u002Fspan><span class=\"meta\">Asclepius listens<\u002Fspan><\u002Fdiv>\n              <div class=\"chip-row\">\n                <span class=\"chip\">Calmer<\u002Fspan><span class=\"chip on\">Same<\u002Fspan><span class=\"chip\">Irritated<\u002Fspan>\n              <\u002Fdiv>\n\n              <div class=\"memory\">\n                <div class=\"mlab\">Last time on this night<\u002Fdiv>\n                <div class=\"mfrom\">From 23 May<\u002Fdiv>\n                <div class=\"mline\">\"A little tight after. Used less next time and it settled.\"<\u002Fdiv>\n              <\u002Fdiv>\n\n              <div class=\"apollo-strip\">\n                <span class=\"glyph\"><svg viewBox=\"0 0 32 32\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\"><circle cx=\"16\" cy=\"16\" r=\"4.4\"><\u002Fcircle><circle cx=\"16\" cy=\"6\" r=\"1.5\" fill=\"currentColor\"><\u002Fcircle><circle cx=\"16\" cy=\"26\" r=\"1.5\" fill=\"currentColor\"><\u002Fcircle><circle cx=\"6\" cy=\"16\" r=\"1.5\" fill=\"currentColor\"><\u002Fcircle><circle cx=\"26\" cy=\"16\" r=\"1.5\" fill=\"currentColor\"><\u002Fcircle><\u002Fsvg><\u002Fspan>\n                <span class=\"as-body\"><span class=\"as-name\">SPF kept this morning <em>Apollo<\u002Fem><\u002Fspan><span class=\"as-sub\">Salicylic raises sun sensitivity — protect tomorrow.<\u002Fspan><\u002Fspan>\n                <span class=\"as-state\">Done<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <nav class=\"tabbar\">\n              <div class=\"tab\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M12 7v5l3 2\"><\u002Fpath><\u002Fsvg><span>Today<\u002Fspan><\u002Fdiv>\n              <div class=\"tab on\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\"><circle cx=\"12\" cy=\"12\" r=\"8\"><\u002Fcircle><path d=\"M8 12a4 4 0 0 1 8 0\"><\u002Fpath><\u002Fsvg><span>Care<\u002Fspan><\u002Fdiv>\n              <div class=\"tab\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"><path d=\"M4 20V9l8-5 8 5v11\"><\u002Fpath><path d=\"M4 20h16\"><\u002Fpath><\u002Fsvg><span>Temple<\u002Fspan><\u002Fdiv>\n              <div class=\"tab\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"><circle cx=\"12\" cy=\"12\" r=\"3\"><\u002Fcircle><path d=\"M12 3v3M12 18v3M3 12h3M18 12h3\"><\u002Fpath><\u002Fsvg><span>Workshop<\u002Fspan><\u002Fdiv>\n            <\u002Fnav>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <p class=\"phone-cap\">Care · Hygieia · Night II (salicylic)<\u002Fp>\n      <\u002Fdiv>\n\n      <div class=\"mock-notes\">\n        <div class=\"dir-name\"><h3>What changed, and why<\u002Fh3><\u002Fdiv>\n        <p class=\"tagline\">Hygieia named, the cycle elevated, and two patrons interlocked — with zero loss of skincare clarity.<\u002Fp>\n        <dl class=\"spec\">\n          <div><dt>Hygieia, named<\u002Fdt><dd>The eyebrow becomes <strong>\"Hygieia · Night II\"<\u002Fstrong> — the patron and the cycle position in one mono line. The accent noun is \"care.\" The god is now the frame around the protocol, not a hidden subtitle.<\u002Fdd><\u002Fdiv>\n          <div><dt>Protocol elevated<\u002Fdt><dd>Tonight's active ingredient gets the <strong>featured bronze hero<\u002Fstrong> — roman-numeral night index, ingredient name, the practical one-line guidance from <code>CARE_PROTOCOL_NOTES<\u002Fcode>. The single most consequential fact (what you're putting on your skin) is the warmest thing on screen.<\u002Fdd><\u002Fdiv>\n          <div><dt>Steps, clear<\u002Fdt><dd>Naked separator rows, bronze checks, mono micro-hints (\"pea-sized\"). Pure §19A practical clarity — unchanged in logic.<\u002Fdd><\u002Fdiv>\n          <div><dt>Asclepius interlock<\u002Fdt><dd>The skin check-in (calmer / same / irritated) is now labelled <strong>\"Asclepius listens\"<\u002Fstrong>. Choosing <em>irritated<\u002Fem> is what summons Recovery — the reaction state becomes the doorway to the recovery patron, binding the two domains by need, not decoration.<\u002Fdd><\u002Fdiv>\n          <div><dt>Apollo interlock<\u002Fdt><dd>A quiet strip ties tonight's salicylic to <strong>tomorrow's SPF<\u002Fstrong> (\"salicylic raises sun sensitivity\"). Apollo's job (protection) is made <em>practically necessary<\u002Fem> by Hygieia's job (actives). This is the doctrine working: one patron's utility creates another's.<\u002Fdd><\u002Fdiv>\n          <div><dt>Reaction memory<\u002Fdt><dd>\"Last time on this night\" (EA-174) stays — the room returning a relevant prior note keyed by cycle, not a trend. Mnemosyne's grammar, inside Care.<\u002Fdd><\u002Fdiv>\n        <\u002Fdl>\n        <div class=\"judgement keep\">\n          <div><h4>What stays<\u002Fh4><ul><li>3-night cycle logic, task IDs, §19A calendar<\u002Fli><li>Skin check-in + reaction note + cycle memory<\u002Fli><li>All practical skincare guidance<\u002Fli><\u002Ful><\u002Fdiv>\n          <div class=\"remove\"><h4>What's corrected<\u002Fh4><ul><li>Hygieia named in the masthead<\u002Fli><li>Active ingredient gets the featured hero<\u002Fli><li>Asclepius + Apollo interlock by genuine need<\u002Fli><\u002Ful><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ VII · DOMAIN VERDICTS ============ -->\n  <section class=\"block\" id=\"verdicts\" data-screen-label=\"Domain verdicts\">\n    <div class=\"rule\"><span class=\"idx\">VII<\u002Fspan><span class=\"lbl\">Verdicts · Light · Body · Mind · Water · Sleep<\u002Fspan><\u002Fdiv>\n    <div class=\"sec-head\">\n      <h2>Rebuilt, renamed, folded, or <span class=\"ital\">retired<\u002Fspan><\u002Fh2>\n      <p class=\"lede-p\">The decisions at a glance. No domain is preserved because it already exists — each had to re-earn its place against the two gates. Two pass as-is, two are rebuilt, one is retired.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"verdicts\">\n      <div class=\"verdict-row\">\n        <span class=\"vglyph\"><svg viewBox=\"0 0 32 32\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\"><circle cx=\"16\" cy=\"16\" r=\"4.4\"><\u002Fcircle><circle cx=\"16\" cy=\"6\" r=\"1.5\" fill=\"currentColor\"><\u002Fcircle><circle cx=\"16\" cy=\"26\" r=\"1.5\" fill=\"currentColor\"><\u002Fcircle><circle cx=\"6\" cy=\"16\" r=\"1.5\" fill=\"currentColor\"><\u002Fcircle><circle cx=\"26\" cy=\"16\" r=\"1.5\" fill=\"currentColor\"><\u002Fcircle><circle cx=\"8.5\" cy=\"8.5\" r=\"1.4\" fill=\"currentColor\"><\u002Fcircle><circle cx=\"23.5\" cy=\"8.5\" r=\"1.4\" fill=\"currentColor\"><\u002Fcircle><circle cx=\"8.5\" cy=\"23.5\" r=\"1.4\" fill=\"currentColor\"><\u002Fcircle><circle cx=\"23.5\" cy=\"23.5\" r=\"1.4\" fill=\"currentColor\"><\u002Fcircle><\u002Fsvg><\u002Fspan>\n        <div class=\"vname\"><div class=\"domain\">Light<\u002Fdiv><div class=\"becomes\">→ Apollo · daylight protection<\u002Fdiv><\u002Fdiv>\n        <span class=\"vaction rebuild\">Rebuild<\u002Fspan>\n        <div class=\"vwhy\">Today it is a tone-picker with no payoff — Drift-one decoration. <strong>Rebuild around SPF and sun-threshold<\u002Fstrong>, bound to Care's sunscreen step. The patron of the sun must be about the sun on your skin. If a full rebuild is too costly, fold it into Care's morning rather than keep the empty gesture.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"verdict-row\">\n        <span class=\"vglyph\"><svg viewBox=\"0 0 32 32\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M16 7 23 21 9 21 Z\"><\u002Fpath><line x1=\"7\" y1=\"24.5\" x2=\"25\" y2=\"24.5\"><\u002Fline><\u002Fsvg><\u002Fspan>\n        <div class=\"vname\"><div class=\"domain\">Body<\u002Fdiv><div class=\"becomes\">→ Asclepius · recovery<\u002Fdiv><\u002Fdiv>\n        <span class=\"vaction rebuild\">Rename<\u002Fspan>\n        <div class=\"vwhy\">Generic desk-stretch fails the Form Gate — it could be any wellness app. <strong>Recast as skin recovery &amp; barrier repair<\u002Fstrong>, summoned by Care's \"irritated\" reaction state. This is a job only Elysium's skincare core justifies. Desk-relief survives as a minor affordance, not the identity.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"verdict-row\">\n        <span class=\"vglyph\"><svg viewBox=\"0 0 32 32\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M16 6 26 16 16 26 6 16 Z\"><\u002Fpath><line x1=\"8.5\" y1=\"16\" x2=\"23.5\" y2=\"16\"><\u002Fline><\u002Fsvg><\u002Fspan>\n        <div class=\"vname\"><div class=\"domain\">Mind<\u002Fdiv><div class=\"becomes\">→ Athena · clarity<\u002Fdiv><\u002Fdiv>\n        <span class=\"vaction keep\">Keep<\u002Fspan>\n        <div class=\"vwhy\">Already corrected at EA-178B: a single offload surface that can <strong>send a thread to Today<\u002Fstrong>. It passes both gates — real job (mental-load relief), real form (the only patron that writes into Kairos). <strong>Protect it<\u002Fstrong>; do not let a duration timer creep back.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"verdict-row gone\">\n        <span class=\"vglyph\"><svg viewBox=\"0 0 32 32\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M7 14 q4 -4 8 0 q4 4 8 0\"><\u002Fpath><path d=\"M7 20 q4 -4 8 0 q4 4 8 0\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n        <div class=\"vname\"><div class=\"domain\">Water<\u002Fdiv><div class=\"becomes gone\">→ retired · folded<\u002Fdiv><\u002Fdiv>\n        <span class=\"vaction retire\">Retire<\u002Fspan>\n        <div class=\"vwhy\">No job survives a gate. A counter is unconstitutional; a \"Lethe\" release ritual is decoration. <strong>Finish the EA-179→183 fold:<\u002Fstrong> hydration becomes a Hygieia line, the grounding pause folds into Asclepius. Do not resurrect it as a patron. A god with no job is the failure we are correcting.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"verdict-row\">\n        <span class=\"vglyph\"><svg viewBox=\"0 0 32 32\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M22 18.5 A8.5 8.5 0 1 1 14 7 A6.6 6.6 0 0 0 22 18.5 Z\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n        <div class=\"vname\"><div class=\"domain\">Sleep<\u002Fdiv><div class=\"becomes\">→ Hypnos · closure<\u002Fdiv><\u002Fdiv>\n        <span class=\"vaction keep\">Keep<\u002Fspan>\n        <div class=\"vwhy\">Already strong (EA-176): parking note + carry/pass decision that routes into the next morning's Kairos handoff. A genuine night-to-morning loop. Passes both gates. <strong>Keep as-is<\u002Fstrong>; never let it drift toward sleep-tracking.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ VIII · ROADMAP ============ -->\n  <section class=\"block\" id=\"roadmap\" data-screen-label=\"Roadmap\">\n    <div class=\"rule\"><span class=\"idx\">VIII<\u002Fspan><span class=\"lbl\">Implementation roadmap · recommended order<\u002Fspan><\u002Fdiv>\n    <div class=\"sec-head\">\n      <h2>Eight tickets, <span class=\"ital\">in order<\u002Fspan><\u002Fh2>\n      <p class=\"lede-p\">Doctrine first, then clear the board, then bind the patrons, then re-anchor the front surfaces. Each ticket is small, reversible, and one concern — per the CLAUDE.md workflow. EA numbers continue from EA-183.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"roadmap\">\n\n      <div class=\"ticket\">\n        <div class=\"ticket-head\"><span class=\"ea\">EA-184<\u002Fspan><span class=\"tt\">Doctrine &amp; IA reframe<\u002Fspan><span class=\"ord\">01 · docs only<\u002Fspan><\u002Fdiv>\n        <div class=\"ticket-grid\">\n          <div><dt>Purpose<\u002Fdt><dd>Adopt the Patron Test and the day-arc as binding doctrine before any code moves. Everything downstream cites this.<\u002Fdd><\u002Fdiv>\n          <div><dt>Files<\u002Fdt><dd><code>CLAUDE.md<\u002Fcode> §7 tone, <code>README.md<\u002Fcode> product shape, a doctrine note in <code>docs/continuity-constitution.md<\u002Fcode>.<\u002Fdd><\u002Fdiv>\n          <div><dt>Visual<\u002Fdt><dd>None. Documentation only.<\u002Fdd><\u002Fdiv>\n          <div><dt>Functional<\u002Fdt><dd>None. Establishes the gates and the patron→job→hour mapping as the reference for EA-185+.<\u002Fdd><\u002Fdiv>\n          <div class=\"span2\"><dt class=\"warn\">Must not change<\u002Fdt><dd>No app code, state, storage, schema, or SW. The constitution still supersedes; the Patron Test sits above it on purpose, not against it.<\u002Fdd><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"ticket\">\n        <div class=\"ticket-head\"><span class=\"ea\">EA-185<\u002Fspan><span class=\"tt\">Complete the Water retirement<\u002Fspan><span class=\"ord\">02 · cleanup<\u002Fspan><\u002Fdiv>\n        <div class=\"ticket-grid\">\n          <div><dt>Purpose<\u002Fdt><dd>Clear the board. Finish folding Water so no orphaned standalone surface or constant remains.<\u002Fdd><\u002Fdiv>\n          <div><dt>Files<\u002Fdt><dd><code>js/domains/water.js<\u002Fcode>, <code>constants.js<\u002Fcode>, Work-Flow water step in <code>js/ui/flow.js<\u002Fcode>, <code>temple.js<\u002Fcode> traces.<\u002Fdd><\u002Fdiv>\n          <div><dt>Visual<\u002Fdt><dd>Any residual Water card/step disappears. Hydration appears as a line in Hygieia's habit list.<\u002Fdd><\u002Fdiv>\n          <div><dt>Functional<\u002Fdt><dd>Grounding \"notice temperature, breathe\" pause re-homed into the future Asclepius reset. <code>holdWater<\u002Fcode> state kept for storage compatibility only.<\u002Fdd><\u002Fdiv>\n          <div class=\"span2\"><dt class=\"warn\">Must not change<\u002Fdt><dd><code>STORAGE_KEY<\u002Fcode>, the <code>water.holdings<\u002Fcode> shape (migration compatibility), or Care. Do not delete stored data — only remove UI surfaces.<\u002Fdd><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"ticket\">\n        <div class=\"ticket-head\"><span class=\"ea\">EA-186<\u002Fspan><span class=\"tt\">Body → Asclepius (Recovery)<\u002Fspan><span class=\"ord\">03 · recast<\u002Fspan><\u002Fdiv>\n        <div class=\"ticket-grid\">\n          <div><dt>Purpose<\u002Fdt><dd>Give Body a job only Elysium could justify: skin recovery and barrier repair, bound to Care's reaction state.<\u002Fdd><\u002Fdiv>\n          <div><dt>Files<\u002Fdt><dd><code>js/domains/body.js<\u002Fcode> → recovery logic, <code>constants.js<\u002Fcode> recovery guidance, Care render in <code>common.js<\u002Fcode>, <code>temple.js<\u002Fcode> labels.<\u002Fdd><\u002Fdiv>\n          <div><dt>Visual<\u002Fdt><dd>Domain reads \"Recovery / Asclepius.\" Calm clinical relief surface; desk-relief chips demoted to a secondary affordance.<\u002Fdd><\u002Fdiv>\n          <div><dt>Functional<\u002Fdt><dd>\"Irritated\" skin check-in surfaces recovery guidance (rest actives, simplify, support barrier). Body arrivals state preserved.<\u002Fdd><\u002Fdiv>\n          <div class=\"span2\"><dt class=\"warn\">Must not change<\u002Fdt><dd><code>state.body.arrivals<\u002Fcode> shape; the §19D Body Relief exception scope; no symptom history, pain scales, or medical claims.<\u002Fdd><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"ticket\">\n        <div class=\"ticket-head\"><span class=\"ea\">EA-187<\u002Fspan><span class=\"tt\">Apollo as daylight protection<\u002Fspan><span class=\"ord\">04 · bind<\u002Fspan><\u002Fdiv>\n        <div class=\"ticket-grid\">\n          <div><dt>Purpose<\u002Fdt><dd>Replace the empty tone-picker with a real job: SPF awareness and sun threshold, tied to Care's sunscreen step.<\u002Fdd><\u002Fdiv>\n          <div><dt>Files<\u002Fdt><dd><code>js/domains/light.js<\u002Fcode>, <code>constants.js<\u002Fcode> (retire <code>LIGHT_*<\u002Fcode> tone copy), Care morning render, <code>flow.js<\u002Fcode> morning step.<\u002Fdd><\u002Fdiv>\n          <div><dt>Visual<\u002Fdt><dd>Morning threshold carries one practical SPF line; the airy tone gesture rides on top of a real acknowledgment, not instead of one.<\u002Fdd><\u002Fdiv>\n          <div><dt>Functional<\u002Fdt><dd>SPF-on acknowledgment links to Care <code>m2<\u002Fcode>; horizon witness marks (§16) preserved. No counts.<\u002Fdd><\u002Fdiv>\n          <div class=\"span2\"><dt class=\"warn\">Must not change<\u002Fdt><dd><code>state.light.entries<\u002Fcode> shape; the §16 Light continuity rules (horizon fade, always-available witness, never counted).<\u002Fdd><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"ticket\">\n        <div class=\"ticket-head\"><span class=\"ea\">EA-188<\u002Fspan><span class=\"tt\">Care as Hygieia — anchor &amp; interlock<\u002Fspan><span class=\"ord\">05 · anchor<\u002Fspan><\u002Fdiv>\n        <div class=\"ticket-grid\">\n          <div><dt>Purpose<\u002Fdt><dd>Name the patron, elevate the active ingredient to the hero, and interlock Apollo (SPF) + Asclepius (recovery) by genuine need. §VI mock.<\u002Fdd><\u002Fdiv>\n          <div><dt>Files<\u002Fdt><dd><code>css/today.css<\u002Fcode> (Care overrides), <code>index.html<\u002Fcode> Care pane, <code>js/render/common.js<\u002Fcode>, <code>care.js<\u002Fcode>.<\u002Fdd><\u002Fdiv>\n          <div><dt>Visual<\u002Fdt><dd>\"Hygieia · Night II\" eyebrow; featured bronze protocol hero with roman-numeral index; Asclepius/Apollo interlock strips.<\u002Fdd><\u002Fdiv>\n          <div><dt>Functional<\u002Fdt><dd>\"Irritated\" → Asclepius; salicylic/retinoid nights → Apollo SPF emphasis next morning. Reaction memory unchanged.<\u002Fdd><\u002Fdiv>\n          <div class=\"span2\"><dt class=\"warn\">Must not change<\u002Fdt><dd>3-day cycle logic, task IDs (<code>m1–m3<\u002Fcode>, <code>n1–n8<\u002Fcode>), <code>loggedDays<\u002Fcode>, milestone thresholds, the §19A boundaries (no streaks, %, counts).<\u002Fdd><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"ticket\">\n        <div class=\"ticket-head\"><span class=\"ea\">EA-189<\u002Fspan><span class=\"tt\">Today as Kairos — front door<\u002Fspan><span class=\"ord\">06 · re-anchor<\u002Fspan><\u002Fdiv>\n        <div class=\"ticket-grid\">\n          <div><dt>Purpose<\u002Fdt><dd>Shift the heading noun to the moment and give open rows patron identity, so Today reads as a threshold, not a todo list. §V mock.<\u002Fdd><\u002Fdiv>\n          <div><dt>Files<\u002Fdt><dd><code>css/today.css<\u002Fcode>, <code>index.html<\u002Fcode> Today pane, <code>js/render/today-plan.js<\u002Fcode>.<\u002Fdd><\u002Fdiv>\n          <div><dt>Visual<\u002Fdt><dd>Period-keyed heading (\"What the <em>morning<\u002Fem> asks\"); open rows gain glyph + plain job + italic patron name; \"The hour holds\" label.<\u002Fdd><\u002Fdiv>\n          <div><dt>Functional<\u002Fdt><dd>Open set ordered by day-arc using existing <code>getPeriodKey()<\u002Fcode>. No new state.<\u002Fdd><\u002Fdiv>\n          <div class=\"span2\"><dt class=\"warn\">Must not change<\u002Fdt><dd><code>state.today<\u002Fcode> shape, §19B behaviour (1–3 intentions, kept/not-kept, one-day carryover), the 4-tab nav order. No counts or progress.<\u002Fdd><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"ticket\">\n        <div class=\"ticket-head\"><span class=\"ea\">EA-190<\u002Fspan><span class=\"tt\">Temple as the Pantheon<\u002Fspan><span class=\"ord\">07 · map<\u002Fspan><\u002Fdiv>\n        <div class=\"ticket-grid\">\n          <div><dt>Purpose<\u002Fdt><dd>Re-order the Temple domain list by the day-arc and give each card a one-line practical job + patron subtitle. Make Mnemosyne the prominent night anchor.<\u002Fdd><\u002Fdiv>\n          <div><dt>Files<\u002Fdt><dd><code>css/temple.css<\u002Fcode>, <code>js/render/temple.js<\u002Fcode>, <code>index.html<\u002Fcode> Temple pane.<\u002Fdd><\u002Fdiv>\n          <div><dt>Visual<\u002Fdt><dd>Domain cards read \"Mind · hold one thread / <em>Athena<\u002Fem>.\" Featured Care stays primary; cards float by current period (now / kept / later).<\u002Fdd><\u002Fdiv>\n          <div><dt>Functional<\u002Fdt><dd>Period-keyed ordering (extends EA-137). Daily line + Day Thread + Closing Summary preserved.<\u002Fdd><\u002Fdiv>\n          <div class=\"span2\"><dt class=\"warn\">Must not change<\u002Fdt><dd>Temple may not gain a history/archive sub-screen (§14.5); no aggregate status grid (§19A.5); atmosphere stays felt-not-read.<\u002Fdd><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"ticket\">\n        <div class=\"ticket-head\"><span class=\"ea\">EA-191<\u002Fspan><span class=\"tt\">Mnemosyne prominence + Athena audit<\u002Fspan><span class=\"ord\">08 · memory<\u002Fspan><\u002Fdiv>\n        <div class=\"ticket-grid\">\n          <div><dt>Purpose<\u002Fdt><dd>Raise Chronicle's standing as the night anchor and verify the Athena→Today thread bridge survived all the above intact.<\u002Fdd><\u002Fdiv>\n          <div><dt>Files<\u002Fdt><dd><code>js/render/temple.js<\u002Fcode>, <code>chronicle<\u002Fcode> render, <code>js/domains/mind.js<\u002Fcode> (audit only).<\u002Fdd><\u002Fdiv>\n          <div><dt>Visual<\u002Fdt><dd>Chronicle surfaces as the most prominent secondary patron at evening/night in Temple and Today's \"hour holds.\"<\u002Fdd><\u002Fdiv>\n          <div><dt>Functional<\u002Fdt><dd>Confirm \"Send to Today\" still routes Athena threads into Kairos; Well/Drift/search untouched.<\u002Fdd><\u002Fdiv>\n          <div class=\"span2\"><dt class=\"warn\">Must not change<\u002Fdt><dd>Chronicle's four permitted UIs only (§15.5); no tags, counts, or ranking; the Well stays one entry, deterministic, non-actionable.<\u002Fdd><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ IX · FINAL WARNING ============ -->\n  <section class=\"block\" id=\"warning\" data-screen-label=\"Final warning\">\n    <div class=\"rule\"><span class=\"idx\">IX<\u002Fspan><span class=\"lbl\">Final warning · the two ways to fall back<\u002Fspan><\u002Fdiv>\n    <div class=\"sec-head\">\n      <h2>Do not slide back into <span class=\"ital\">either ditch<\u002Fspan><\u002Fh2>\n      <p class=\"lede-p\">The road has a ditch on both sides. Every future ticket should be checked against both before it ships. If a surface is drifting, it is almost always drifting toward one of these.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"warning\">\n      <div class=\"wcol\">\n        <div class=\"wlab\">Ditch one · the left<\u002Fdiv>\n        <h3>Decorative mythology with no utility<\u002Fh3>\n        <ul>\n          <li>Adding a \"patron\" whose only interaction is tap-to-acknowledge with no practical residue.<\u002Fli>\n          <li>Writing more poetic copy to make a feature <em>feel<\u002Fem> meaningful instead of giving it a job.<\u002Fli>\n          <li>Reviving Water (or any retired domain) because the Pantheon \"feels incomplete\" without it.<\u002Fli>\n          <li>Naming a god on a surface that would be identical without the name.<\u002Fli>\n          <li>Building rituals that are beautiful, on-brand, and that no user would miss if deleted.<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div class=\"wcol\">\n        <div class=\"wlab\">Ditch two · the right<\u002Fdiv>\n        <h3>Generic utility with no mythology<\u002Fh3>\n        <ul>\n          <li>Adding a useful feature whose shape is borrowed from a todo or wellness app, with a Greek label pasted on.<\u002Fli>\n          <li>Demoting or removing a patron to \"make room\" for usefulness — the Drift-two error.<\u002Fli>\n          <li>Letting Kairos become a task manager, Athena a timer, or Hypnos a sleep tracker.<\u002Fli>\n          <li>Introducing counts, streaks, %, or dashboards because they are \"just practical\" — the constitution still binds.<\u002Fli>\n          <li>Treating the myth as theming applied last, rather than the floor plan decided first.<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"prose\" style=\"margin-top:46px;\">\n      <p class=\"big\">Before any new surface ships, ask the two questions in order: Would the user miss this if it vanished? — and — Could only this patron hold it? A yes to both is the only road. A no to either is a ditch.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"closing\">\n      <span class=\"eyebrow\">The correction, in one line<\u002Fspan>\n      <p>The myth is not the wallpaper of the room. <span class=\"dim\">It is the floor plan.<\u002Fspan><\u002Fp>\n      <div class=\"sign\">Elysium · Pantheon-led usefulness · for review before EA-184<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n<\u002Fdiv>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
